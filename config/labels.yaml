# Regime-label definitions. FREEZE before the first test run (paper section 3.2).
# Labels are used only to SCORE models, never to train unsupervised ones.
r1_bear:
  fall: 0.20            # drawdown from peak that starts a bear market
  rise: 0.20            # rebound from trough that ends it
  drop: 0.20            # (kept from the original skeleton; unused by the label code)
  recovery: 0.15        # (kept from the original skeleton; unused by the label code)
  start: peak           # 'peak' = dated at the peak (Lunde-Timmermann style) | 'crossing' = day the -20% is hit
r2_vol:
  window: 21
  percentile: 90        # stress when realised vol is above this full-sample percentile
  vix_level: 30         # variant: stress when VIX >= this (needs a VIX series)
  merge_gap: 10         # join episodes separated by fewer than this many days
  min_len: 5            # drop episodes shorter than this
  vix_threshold: 30     # (original skeleton key, same meaning as vix_level)
r3_consensus:
  pelt_pen_scale: 4.0   # PELT penalty = pen_scale * ln(T)
  pelt_min_size: 20
  pelt_jump: 5
  seg_vol_ratio: 1.8    # a PELT segment is stress if its std >= ratio * median daily segment std (tuned on episode count/share only)
  merge_gap: 10         # join episodes separated by fewer than this many days
  ms_prob: 0.5          # smoothed Markov-switching probability of the high-variance regime
  min_len: 5
  pelt_penalty: auto    # (original skeleton key; the code uses pelt_pen_scale)
r4_events:
  tolerance_days: 10
  # PROPOSED dates - team must confirm and freeze. Tolerance is applied by the scorer, not here.
  events:
    - {name: GFC,               start: "2008-09-15", end: "2009-03-09"}
    - {name: Euro_debt_US_dg,   start: "2011-08-01", end: "2011-10-03"}
    - {name: China_oil_2015_16, start: "2015-08-17", end: "2016-02-11"}
    - {name: Q4_2018_selloff,   start: "2018-10-01", end: "2018-12-24"}
    - {name: COVID,             start: "2020-02-24", end: "2020-04-07"}
    - {name: Rate_hikes_2022,   start: "2022-01-03", end: "2022-10-12"}
    - {name: SVB_2023,          start: "2023-03-08", end: "2023-03-24"}
    - {name: Yen_carry_2024,    start: "2024-08-01", end: "2024-08-07"}
    - {name: Tariff_shock_2025, start: "2025-04-02", end: "2025-04-08"}
scoring:
  early_credit_days: 20
  late_window_days: 40
  declutter_days: 20
